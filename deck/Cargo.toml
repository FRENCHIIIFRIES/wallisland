[package]
name = "dotdeck"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
dirs = "7.0.0"
enigo = "0.6.1"
futures-util = "0.3.34"
hostname = "0.4.2"
if-addrs = "0.15.0"
mime_guess = "2.0.5"
open = "5.4.4"
qrcode = { version = "0.14.1", default-features = false }
rand = "0.10.3"
rust-embed = "8.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.38.4"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tao = "0.37.1"
tray-icon = "0.25.1"

[build-dependencies]
winresource = "0.1.31"

[profile.release]
lto = true
codegen-units = 1
strip = true
