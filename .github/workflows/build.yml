name: Build APK

on:
  # Dotdeck has its own workflow; changes that only touch it shouldn't publish a new APK.
  push:
    paths-ignore: ["deck/**", ".github/workflows/deck.yml"]
  pull_request:
    paths-ignore: ["deck/**", ".github/workflows/deck.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug and release APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease lintDebug

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk Wallisland.apk

      - uses: actions/upload-artifact@v4
        with:
          name: wallisland-apk
          path: Wallisland.apk
          if-no-files-found: error

      # Every push publishes a release, so the newest APK is always at
      # https://github.com/<owner>/<repo>/releases/latest/download/Wallisland.apk
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Wallisland build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: Wallisland.apk
          body: |
            Tap **Wallisland.apk** below on your phone to download and install it.
            Built from ${{ github.sha }}.
